x":{"time":-2.5,"energy":-6,"rep":-9,"maturity":-3}}],"bonus":false},{"id":4,"zone":"teams","title":"327 Beiträge später","text":"Im Projektkanal brauchst du Entscheidungen, Eskalationen und Aufgaben mit deinem Namen.","choices":[{"t":"Kanalzusammenfassung auf Entscheidungen und Erwähnungen fokussieren","d":"Du findest zwei Entscheidungen, eine Eskalation und eine eigene Aufgabe. Die GIF-Debatte bleibt professionell ungeklärt.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Gezielt nach Entscheidungen suchen","d":"Du findest die Beschlüsse, übersiehst aber eine Eskalation ohne das Wort „Eskalation“. Frech von der Realität.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Von unten nach oben scrollen","d":"Nach 40 Minuten kennst du das Ende, aber nicht den Anfang. Eine Aufgabe mit deinem Namen lebt weiter im Unterholz.","kind":"bad","fx":{"time":-2.5,"energy":-6,"rep":-9,"maturity":-3}}],"bonus":false},{"id":5,"zone":"teams","title":"Meeting verpasst","text":"Das Anbietergespräch wurde transkribiert. Du brauchst Migration, Risiken und Aktionen.","choices":[{"t":"Recap gezielt nach den drei Themen durchsuchen","d":"Relevante Passagen und Aufgaben sind sichtbar. Anwesenheit war optional, Verantwortung nicht.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Kurzfassung lesen und kritische Punkte nachprüfen","d":"Solider Weg. Die Kurzfassung orientiert, die zweite Prüfrunde kostet aber Zeit.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"So tun, als wärst du dabei gewesen","d":"Im nächsten Termin wirst du nach einer Einschränkung gefragt. Die Stille ist ebenfalls dokumentiert.","kind":"bad","fx":{"time":-2.5,"energy":-7,"rep":-14,"maturity":-3},"flag":"Vertrauensschaden"}],"bonus":false},{"id":6,"zone":"teams","title":"Action Items oder Wunschdenken?","text":"Notizen, Chat und Transkript enthalten Aufgaben.","choices":[{"t":"Alle Quellen referenzieren und Unklarheiten markieren lassen","d":"Sieben Aktionen, zwei ohne Owner und eine widersprüchlich. Genau diese Lücken mussten sichtbar werden.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Mit Transkript starten und Chat ergänzen","d":"Brauchbar, aber der spätere Abgleich kostet Zeit und produziert eine kleine Dublettenfamilie.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Fehlende Owner plausibel ergänzen lassen","d":"Copilot verteilt Arbeit. Die Betroffenen erfahren davon im Statusbericht. Modern Leadership, nur ohne Beteiligung.","kind":"bad","fx":{"time":-2.5,"energy":-6,"rep":-9,"maturity":-3}}],"bonus":false},{"id":7,"zone":"project","title":"Drei Angebote, fünf Formate","text":"Preise, Annahmen und Leistungen sind über Word, Excel und PDF verteilt.","choices":[{"t":"Erst Extraktionsschema definieren, dann auswerten","d":"Leistungen, Preise und Lücken werden vergleichbar, ohne fehlende Werte zu erfinden.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Pro Anbieter zusammenfassen und harmonisieren","d":"Die Einzelbilder sind brauchbar. Begriffe und Preislogiken sprechen aber noch verschiedene Dialekte.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Alle Dateien hochladen und „Wer ist am besten?“ fragen","d":"Du erhältst eine klare Rangfolge auf einer unklaren Bewertungsbasis. Sie sieht wenigstens sehr entschieden aus.","kind":"bad","fx":{"time":-2.5,"energy":-6,"rep":-9,"maturity":-3}}],"bonus":false},{"id":8,"zone":"project","title":"Bewertungsmatrix mit Eigenleben","text":"Einige Antworten fehlen. Das Ranking wirkt überraschend eindeutig.","choices":[{"t":"Widersprüche, Lücken und unbelegte Bewertungen prüfen","d":"Zwei Formelfehler und drei unbelegte Scores tauchen auf. Eindeutigkeit war offenbar nur ein Excel-Effekt.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Ranking mit Stichproben plausibilisieren","d":"Eine Stichprobe findet einen Fehler. Die übrigen Fehler fühlen sich vorerst unbeobachtet.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Fehlende Antworten plausibel ergänzen","d":"Plausibilität ist kein Angebot. Die Rangfolge basiert jetzt teilweise auf Fanfiction.","kind":"bad","fx":{"time":-2.5,"energy":-7,"rep":-14,"maturity":-3},"flag":"Bewertungsfehler"}],"bonus":false},{"id":9,"zone":"project","title":"Vertragsvergleich","text":"Version 12 und Version 12_final_neu sollen verglichen werden.","choices":[{"t":"Beide Dateien referenzieren und Vergleichskriterien nennen","d":"Änderungen, gelöschte Pflichten und Widersprüche werden getrennt ausgewiesen.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Änderungsverfolgung plus Copilot nutzen","d":"Eine belastbare Kombination, sofern die Dateinamen nicht die einzige Versionskontrolle sind.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Nur die neuere Version zusammenfassen","d":"Du weißt, was heute drinsteht, aber nicht, welche Pflicht leise den Raum verlassen hat.","kind":"bad","fx":{"time":-2.5,"energy":-6,"rep":-9,"maturity":-3}}],"bonus":false},{"id":10,"zone":"project","title":"Ich weiß genau, was ich will","text":"Benötigt wird eine Entscheidungsvorlage mit drei Optionen.","choices":[{"t":"Ziel, Zielgruppe, Quellen, Kriterien und Format angeben","d":"Der erste Entwurf liegt nah am Ziel, weil du das Ziel tatsächlich beschrieben hast.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Kurz starten und gezielt nachschärfen","d":"Funktioniert, kostet aber eine Runde, die bei klarer Zielvorstellung vermeidbar gewesen wäre.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Alles in einen Monsterprompt packen","d":"Viel Kontext, keine Hierarchie. Der Prompt hat jetzt mehr Stakeholder als das Projekt.","kind":"bad","fx":{"time":-2.5,"energy":-6,"rep":-9,"maturity":-3}}],"bonus":false},{"id":11,"zone":"lab","title":"Ich weiß noch nicht, was ich will","text":"Die Workshop-Idee ist vage.","choices":[{"t":"Iterativ arbeiten: Entwurf, Kritik, Varianten, Verfeinerung","d":"Jede Runde reduziert Unklarheit. Der Dialog ist hier die Methode.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Erst zwei grobe Richtungen formulieren lassen","d":"Ein sinnvoller Anfang. Kritik und Verfeinerung warten noch im nächsten Raum.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Den perfekten Monsterprompt erzwingen","d":"Du optimierst lange auf ein Ziel, das du noch nicht kennst. Effiziente Kreisbewegung.","kind":"bad","fx":{"time":-2.5,"energy":-6,"rep":-9,"maturity":-3}}],"bonus":false},{"id":12,"zone":"lab","title":"Prompt Coach oder selber?","text":"Die Aufgabe ist mittelkomplex, der Kontext lückenhaft.","choices":[{"t":"Copilot relevante Rückfragen stellen lassen","d":"Die Lücken werden sichtbar, bevor ihnen jemand ein hübsches Layout gibt.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Eigene Annahmen nennen und prüfen lassen","d":"Vertretbar, solange jede Annahme ein Namensschild trägt und überprüfbar bleibt.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Fehlenden Kontext stillschweigend ersetzen","d":"Schnell, glatt und falsch genug, um später teuer zu werden.","kind":"bad","fx":{"time":-2.5,"energy":-6,"rep":-9,"maturity":-3}}],"bonus":false},{"id":13,"zone":"slides","title":"Steering in zwei Stunden","text":"40 Seiten Notizen sollen auf sechs Folien.","choices":[{"t":"Erst Storyline und Entscheidungen, dann Folien","d":"Sechs Folien, drei Entscheidungen, null dekorative Weltkarten. Das Management bleibt wach.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Rohentwurf erstellen und reduzieren","d":"Machbar. Die erste Version hat 24 Folien, aber wenigstens besteht Hoffnung.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"40 Seiten in PowerPoint kopieren","d":"Du erschaffst ein W at nutzen und Erinnerung kontrollieren","d":"Möglich, aber unnötig aufwendig und erstaunlich leicht zu vergessen.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Temporären Chat für alles verwenden","d":"Dein nützlicher Arbeitskontext verschwindet gleich mit. Sehr sauber, sehr leer.","kind":"bad","fx":{"time":-2.5,"energy":-6,"rep":-9,"maturity":-3}}],"bonus":false},{"id":17,"zone":"lab","title":"Die wiederkehrende Freitagsaufgabe","text":"Jeden Freitag brauchst du denselben Wochenrückblick.","choices":[{"t":"Geplanten Prompt einrichten","d":"Wiederholung erkannt und sinnvoll automatisiert. Freitag darf wieder Freitag heißen.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Geprüften Prompt manuell nutzen","d":"Funktioniert zuverlässig, bleibt aber ein fester Termin im Freitagskalender.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Agenten mit zwölf Quellen bauen","d":"Für einen Wochenrückblick hast du eine kleine Behörde gegründet.","kind":"bad","fx":{"time":-2.5,"energy":-6,"rep":-9,"maturity":-3}}],"bonus":false},{"id":18,"zone":"lab","title":"Prompt oder Agent?","text":"Eine Angebotsprüfung wiederholt sich mit stabiler Logik.","choices":[{"t":"Geprüften Prompt als Agentengrundlage nutzen","d":"Wiederholung plus stabile Logik ergibt sinnvolle Skalierung.","kind":"best","fx":{"time":-1,"energy":-2,"rep":5,"maturity":5}},{"t":"Geprüften Prompt zunächst speichern","d":"Gute Zwischenstufe. Der Agent darf warten, bis Volumen und Nutzen belegt sind.","kind":"mid","fx":{"time":-1.5,"energy":-3,"rep":1,"maturity":2}},{"t":"Agent ungeprüft produktiv setzen","d":"Der Agent arbeitet schnell und konsistent. Leider konsistent am Bedarf vorbei.","kind":"bad","fx":{"time":-2.5,"energy":-7,"rep":-14,"maturity":-3},"flag":"Ungeprüfter Agent"}],"bonus":false},{"id":19,"zone":"lab","title":"Notebook oder Chat-Chaos","text":"Viele Dokumente brauchen stabilen Kontext.","choices":[{"t":"Notebook als kuratierten (1).replace('.',',');let S,st,cur,shown,pending,mode,diff='Consultant',gameType='complete';function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function initial(){S=gameType==='tools'?shuffle(TOOLS).slice(0,15):[...shuffle([...BASE,...TOOLS]).slice(0,20),...shuffle(POOL).slice(0,4)];return{time:40,energy:100,rep:50,maturity:0,done:[],fails:[],causes:[]}}function score(){return Math.max(0,Math.round(st.maturity*6+st.rep*3+st.energy+st.time*2-st.fails.length*30))}function meters(){let m=(n,v,max=100)=>`<div class="meter"><small><b>${n}</b><span>${fmt(v)}</span></small><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,v/max*100))}%"></div></div></div>`;$('meters').innerHTML=m('Zeit',st.time,40)+m('Energie',st.energy,100)+m('Reputation',st.rep)+m('Maturity',st.maturity,130)}function apply(c){let f={...c.fx};if(diff==='Rookie')for(let k of ['time','energy','rep'])if(f[k]<0)f[k]*=.7;if(diff==='Copilot Ambassador'){if(c.kind==='bad'){for(let k of ['time','energy','rep'])if(f[k]<0)f[k]*=1.35;f.maturity=Math.min(f.maturity,-5)}else if(c.kind==='mid'){f.time*=1.15;f.energy*=1.15;f.rep=Math.min(f.rep,0);f.maturity=Math.min(f.maturity,1)}}st.time=Math.max(0,st.time+f.time);st.energy=Math.max(0,st.energy+f.energy);st.rep=Math.max(0,Math.min(100,st.rep+f.rep));st.maturity=Math.max(0,Math.min(130,st.maturity+f.maturity));st.done.push(cur.id);if(c.flag)st.fails.push(c.flag);st.causes.push({mission:cur.title,choice:c.t,kind:c.kind,flag:c.flag||''});return f}function choose(i){let snap=JSON.stringify(st),c=shown[i],f=apply(c);pending={c,snap,f};mode='result';render()}function accept(){cur=null;pending=null;render()}function undo(){st=JSON.parse(pending.snap);st.time-=diff==='Rookie'?1:diff==='Copilot Ambassador'?3:2;st.energy-=diff==='Copilot Ambassador'?4:2;shown=shuffle(cur.choices);pending=null;mode='choose';render()}

0':'2,0'} Stunden und ${diff==='Copilot Ambassador'?'4,0':'2,0'} Energie.</p></div><div class="actions"><button class="btn" data-action="undo">Trotzdem rückgängig</button><button class="btn" data-action="cancel">Folge akzeptieren</button></div>`;$('app').innerHTML=`<div class="scene"><div class="head"><h1>${cur.title}</h1><p>${cur.text}</p></div><div class="body">${b}</div></div>`}function start(){document.querySelector('.intro').classList.add('hide');document.querySelector('.game').classList.remove('hide');restart()}document.addEventListener('click',e=>{let d=e.target.closest('[data-diff]');if(d){diff=d.dataset.diff;document.querySelectorAll('[data-diff]').forEach(b=>{let on=b===d;b.setAttribute('aria-pressed',on);b.classList.toggle('selected',on)});return}let gt=e.target.closest('[data-type]');if(gt){gameType=gt.dataset.type;document.querySelectorAll('[data-type]').forEach(b=>{let on=b===gt;b.setAttribute('aria-pressed',on);b.classList.toggle('selected',on)});return}let q=e.target.closest('[data-scene]');if(q){cur=S.find(x=>x.id==q.dataset.scene);shown=shuffle(cur.choices);mode='choose';render();return}let c=e.target.closest('[data-choice]');if(c){choose(+c.dataset.choice);return}let a=e.target.closest('[data-action]');if(a)({accept,askUndo:()=>{mode='undo';render()},undo,cancel:()=>{mode='result';render()},restart,home})[a.dataset.action]()});$('start').onclick=start;</script></body></html>
