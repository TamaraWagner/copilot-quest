<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copilot Quest</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f7f7ed;color:#173c1b}button{font:inherit}.hide{display:none}.intro{padding:8px 12px;background:#f3fae8}.hero{max-width:980px;margin:auto;background:#F6F6AC;border:4px solid #9bc59f;border-radius:24px;padding:18px 28px}.btn{border:2px solid #245A28;border-radius:11px;padding:11px 16px;background:white;color:#245A28;font-weight:700;cursor:pointer}.btn:hover{background:#E5FBE7}.btn:focus{outline:3px solid #a9d3ad;outline-offset:2px}.row,.actions,.badges{display:flex;gap:8px;flex-wrap:wrap}.top{padding:8px 3vw;background:white;border-bottom:1px solid #ddd}.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.bar{height:7px;background:#ddd}.fill{height:100%;background:#2B692E}.meter small{display:flex;justify-content:space-between}main{max-width:1250px;margin:auto;padding:12px 3vw}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:11px}.card{background:white;border:2px solid #e3e3da;border-radius:18px;padding:17px}.mission{text-align:left}.scene{max-width:850px;margin:auto}.head{padding:20px;background:linear-gradient(135deg,#E5FBE7,#F6F6AC);border-radius:22px 22px 0 0}.body{padding:20px;background:white}.choice{width:100%;text-align:left;border:2px solid #ddd;background:white;padding:13px;margin:7px 0;border-radius:12px}.result{padding:16px;background:#E5FBE7;border-radius:13px}.bad{background:#fff0f0}.tag{display:inline-block;background:#E5FBE7;border-radius:16px;padding:5px 8px;font-size:12px;font-weight:700}.leader{width:100%;border-collapse:collapse}.leader td,.leader th{padding:7px;border-bottom:1px solid #ddd}.endbuttons .btn{background:white;color:#245A28}.endbuttons .btn:hover{background:#E5FBE7}@media(max-width:760px){.meters{grid-template-columns:1fr 1fr}}.end{max-width:980px;margin:auto}.endReason{font-size:1.25rem;font-weight:700}.endStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.endStats div{background:#f6f7f2;padding:11px;border-radius:10px}.endSection,.endTip{margin-top:16px;padding:14px;border-radius:12px;background:#f6f7f2}.endTip{background:#fff8cc;border-left:5px solid #d5a720}.endSection li,.endTip li{margin:8px 0}.endbuttons{margin-top:16px}@media(max-width:760px){.endStats{grid-template-columns:1fr 1fr}}</style></head><body><section class="intro"><div class="hero"><h1>Copilot Quest</h1><p>Eine Woche im Projektchaos</p><p>Wähle die Schwierigkeitsstufe und starte dann die Mission.</p><div class="row"><button class="btn" data-diff="Rookie">Rookie</button><button class="btn" data-diff="Consultant">Consultant</button><button class="btn" data-diff="Copilot Ambassador">Copilot Ambassador</button></div><br><button id="start" class="btn">Mission starten</button></div></section><section class="game hide"><header class="top"><div id="meters" class="meters"></div></header><main id="app"></main></section><script>const BASE=[{"id": 1, "zone": "outlook", "title": "Das Postfach des Grauens", "text": "57 ungelesene Mails. Du brauchst Status, Fristen und echte Aufgaben.", "choices": [{"t": "Copilot nach Themen, Entscheidungen und Fristen zusammenfassen lassen", "d": "Du erkennst drei Arbeitsstränge und zwei Fristen. Der Newsletter zu ergonomischen Mauspads bleibt unangetastet.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Nur markierte Mails öffnen", "d": "Du siehst viel Dringlichkeit und übersiehst zwei unmarkierte Kundenfragen. Rote Ausrufezeichen sind offenbar kein Priorisierungskonzept.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Alle Mails chronologisch lesen", "d": "Nach fast drei Stunden kennst du jede Abwesenheitsnotiz. Der Projektstatus ist weiterhin unklar.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 2, "zone": "outlook", "title": "Die Mailkette ohne Anfang", "text": "34 Nachrichten. Gesucht werden Entscheidung, offene Punkte und Verantwortliche.", "choices": [{"t": "Zusammenfassung mit expliziten Kategorien anfordern", "d": "Entscheidung, Aufgaben, Fristen und Konflikte stehen getrennt. So sieht Nutzwert aus.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Mit „Fass mal zusammen“ starten", "d": "Du erhältst eine höfliche Nacherzählung. Sie ist korrekt und praktisch nutzlos.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Die Kette mit „Kannst du kurz?“ weiterleiten", "d": "Dein Problem hat jetzt einen neuen Besitzer. Deine Reputation allerdings auch.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 3, "zone": "outlook", "title": "Die Antwort, die 30 Sekunden braucht", "text": "Ein Kollege fragt nach dem bekannten Link zum Projektordner.", "choices": [{"t": "Kurz selbst antworten", "d": "Der Link ist nach 30 Sekunden verschickt. Nicht jede Aufgabe braucht KI, Orchestrierung und einen Agenten mit Markenidentität.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Eine kurze Copilot-Antwort nutzen", "d": "Die Antwort ist freundlich und korrekt. Das Einfügen des Links hätte allerdings weniger Zeit gebraucht.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Einen Agenten dafür konzipieren", "d": "Nach Architekturarbeit verschickst du einen Link. Technisch beeindruckend, praktisch eher Behördenaufbau.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 4, "zone": "teams", "title": "327 Beiträge später", "text": "Im Projektkanal brauchst du Entscheidungen, Eskalationen und Aufgaben mit deinem Namen.", "choices": [{"t": "Kanalzusammenfassung auf Entscheidungen und Erwähnungen fokussieren", "d": "Du findest zwei Entscheidungen, eine Eskalation und eine eigene Aufgabe. Die GIF-Debatte bleibt professionell ungeklärt.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Gezielt nach Entscheidungen suchen", "d": "Du findest die Beschlüsse, übersiehst aber eine Eskalation ohne das Wort „Eskalation“. Frech von der Realität.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Von unten nach oben scrollen", "d": "Nach 40 Minuten kennst du das Ende, aber nicht den Anfang. Eine Aufgabe mit deinem Namen lebt weiter im Unterholz.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 5, "zone": "teams", "title": "Meeting verpasst", "text": "Das Anbietergespräch wurde transkribiert. Du brauchst Migration, Risiken und Aktionen.", "choices": [{"t": "Recap gezielt nach den drei Themen durchsuchen", "d": "Relevante Passagen und Aufgaben sind sichtbar. Anwesenheit war optional, Verantwortung nicht.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Kurzfassung lesen und kritische Punkte nachprüfen", "d": "Solider Weg. Die Kurzfassung orientiert, die zweite Prüfrunde kostet aber Zeit.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "So tun, als wärst du dabei gewesen", "d": "Im nächsten Termin wirst du nach einer Einschränkung gefragt. Die Stille ist ebenfalls dokumentiert.", "kind": "bad", "fx": {"time": -2.5, "energy": -7, "rep": -14, "maturity": -3}, "flag": "Vertrauensschaden"}], "bonus": false}, {"id": 6, "zone": "teams", "title": "Action Items oder Wunschdenken?", "text": "Notizen, Chat und Transkript enthalten Aufgaben.", "choices": [{"t": "Alle Quellen referenzieren und Unklarheiten markieren lassen", "d": "Sieben Aktionen, zwei ohne Owner und eine widersprüchlich. Genau diese Lücken mussten sichtbar werden.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Mit Transkript starten und Chat ergänzen", "d": "Brauchbar, aber der spätere Abgleich kostet Zeit und produziert eine kleine Dublettenfamilie.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Fehlende Owner plausibel ergänzen lassen", "d": "Copilot verteilt Arbeit. Die Betroffenen erfahren davon im Statusbericht. Modern Leadership, nur ohne Beteiligung.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 7, "zone": "project", "title": "Drei Angebote, fünf Formate", "text": "Preise, Annahmen und Leistungen sind über Word, Excel und PDF verteilt.", "choices": [{"t": "Erst Extraktionsschema definieren, dann auswerten", "d": "Leistungen, Preise und Lücken werden vergleichbar, ohne fehlende Werte zu erfinden.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Pro Anbieter zusammenfassen und harmonisieren", "d": "Die Einzelbilder sind brauchbar. Begriffe und Preislogiken sprechen aber noch verschiedene Dialekte.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Alle Dateien hochladen und „Wer ist am besten?“ fragen", "d": "Du erhältst eine klare Rangfolge auf einer unklaren Bewertungsbasis. Sie sieht wenigstens sehr entschieden aus.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 8, "zone": "project", "title": "Bewertungsmatrix mit Eigenleben", "text": "Einige Antworten fehlen. Das Ranking wirkt überraschend eindeutig.", "choices": [{"t": "Widersprüche, Lücken und unbelegte Bewertungen prüfen", "d": "Zwei Formelfehler und drei unbelegte Scores tauchen auf. Eindeutigkeit war offenbar nur ein Excel-Effekt.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Ranking mit Stichproben plausibilisieren", "d": "Eine Stichprobe findet einen Fehler. Die übrigen Fehler fühlen sich vorerst unbeobachtet.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Fehlende Antworten plausibel ergänzen", "d": "Plausibilität ist kein Angebot. Die Rangfolge basiert jetzt teilweise auf Fanfiction.", "kind": "bad", "fx": {"time": -2.5, "energy": -7, "rep": -14, "maturity": -3}, "flag": "Bewertungsfehler"}], "bonus": false}, {"id": 9, "zone": "project", "title": "Vertragsvergleich", "text": "Version 12 und Version 12_final_neu sollen verglichen werden.", "choices": [{"t": "Beide Dateien referenzieren und Vergleichskriterien nennen", "d": "Änderungen, gelöschte Pflichten und Widersprüche werden getrennt ausgewiesen.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Änderungsverfolgung plus Copilot nutzen", "d": "Eine belastbare Kombination, sofern die Dateinamen nicht die einzige Versionskontrolle sind.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Nur die neuere Version zusammenfassen", "d": "Du weißt, was heute drinsteht, aber nicht, welche Pflicht leise den Raum verlassen hat.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 10, "zone": "project", "title": "Ich weiß genau, was ich will", "text": "Benötigt wird eine Entscheidungsvorlage mit drei Optionen.", "choices": [{"t": "Ziel, Zielgruppe, Quellen, Kriterien und Format angeben", "d": "Der erste Entwurf liegt nah am Ziel, weil du das Ziel tatsächlich beschrieben hast.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Kurz starten und gezielt nachschärfen", "d": "Funktioniert, kostet aber eine Runde, die bei klarer Zielvorstellung vermeidbar gewesen wäre.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Alles in einen Monsterprompt packen", "d": "Viel Kontext, keine Hierarchie. Der Prompt hat jetzt mehr Stakeholder als das Projekt.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 11, "zone": "lab", "title": "Ich weiß noch nicht, was ich will", "text": "Die Workshop-Idee ist vage.", "choices": [{"t": "Iterativ arbeiten: Entwurf, Kritik, Varianten, Verfeinerung", "d": "Jede Runde reduziert Unklarheit. Der Dialog ist hier die Methode.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Erst zwei grobe Richtungen formulieren lassen", "d": "Ein sinnvoller Anfang. Kritik und Verfeinerung warten noch im nächsten Raum.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Den perfekten Monsterprompt erzwingen", "d": "Du optimierst lange auf ein Ziel, das du noch nicht kennst. Effiziente Kreisbewegung.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 12, "zone": "lab", "title": "Prompt Coach oder selber?", "text": "Die Aufgabe ist mittelkomplex, der Kontext lückenhaft.", "choices": [{"t": "Copilot relevante Rückfragen stellen lassen", "d": "Die Lücken werden sichtbar, bevor ihnen jemand ein hübsches Layout gibt.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Eigene Annahmen nennen und prüfen lassen", "d": "Vertretbar, solange jede Annahme ein Namensschild trägt und überprüfbar bleibt.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Fehlenden Kontext stillschweigend ersetzen", "d": "Schnell, glatt und falsch genug, um später teuer zu werden.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 13, "zone": "slides", "title": "Steering in zwei Stunden", "text": "40 Seiten Notizen sollen auf sechs Folien.", "choices": [{"t": "Erst Storyline und Entscheidungen, dann Folien", "d": "Sechs Folien, drei Entscheidungen, null dekorative Weltkarten. Das Management bleibt wach.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Rohentwurf erstellen und reduzieren", "d": "Machbar. Die erste Version hat 24 Folien, aber wenigstens besteht Hoffnung.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "40 Seiten in PowerPoint kopieren", "d": "Du erschaffst ein Word-Dokument mit Foliennummern. Niemand findet die Entscheidung.", "kind": "bad", "fx": {"time": -2.5, "energy": -7, "rep": -14, "maturity": -3}, "flag": "Folienlawine"}], "bonus": false}, {"id": 14, "zone": "slides", "title": "Die wiederkehrende Entscheidungsvorlage", "text": "Monatlich entstehen ähnliche Präsentationen.", "choices": [{"t": "Benutzerdefinierten PowerPoint-Skill verwenden", "d": "Wiederverwendbare Regeln sorgen für konsistente Struktur, Sprache und Gestaltung.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Geprüfte Vorlage plus klaren Prompt verwenden", "d": "Solide, aber Änderungen müssen weiterhin manuell durch die Folienlandschaft wandern.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Monatlich einen neuen Agenten bauen", "d": "Du hast zwölf Agenten und immer noch keinen Präsentationsstandard.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9, "maturity": -3}}], "bonus": false}, {"id": 15, "zone": "slides", "title": "Final_final_v7", "text": "Quellen, Begriffe und Empfehlung müssen geprüft werden.", "choices": [{"t": "Review-Schleife für Aussagen, Annahmen und Quellen", "d": "Aus einem guten Entwurf wird ein belastbares Ergebnis. Prüfen war tatsächlich Teil der Arbeit.", "kind": "best", "fx": {"time": -1, "energy": -2, "rep": 5, "maturity": 5}}, {"t": "Fachreview plus Copilot-Sprachprüfung", "d": "Stark, aber langsamer. Inhalt bleibt Menschenarbeit, Sprache bekommt Unterstützung.", "kind": "mid", "fx": {"time": -1.5, "energy": -3, "rep": 1, "maturity": 2}}, {"t": "Nur das Design polieren", "d": "Die unbelegte Zahl hat jetzt einen sehr schönen Schatten.", "kind": "bad", "fx": {"time": -2.5, "energy": -6, "rep": -9,
